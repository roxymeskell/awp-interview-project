version: '3.8'
services:
  dev:
    build:
      context: ../
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ../:/workspace:cached
    tty: true
    environment:
        APP_ENV: local
        DB_CONNECTION: mysql
        DB_HOST: mariadb
        DB_PORT: 3306
        DB_DATABASE: awp_employee_happiness
        DB_USERNAME: root
        DB_PASSWORD:
  mariadb:
    image: "mariadb:latest"
    ports:
       - '3306:3306'
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 1
      MARIADB_DATABASE: awp_employee_happiness